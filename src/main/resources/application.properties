spring.application.name=texos-backend

# Spring Boot does not load .env files by default. This imports the backend's
# .env as a properties file when the application is started from this folder.
# OS environment variables still take precedence over values in .env.
spring.config.import=optional:file:./.env[.properties]

# MySQL Database Configuration
spring.datasource.url=${TEXOS_DB_URL}
spring.datasource.username=${TEXOS_DB_USERNAME}
spring.datasource.password=${TEXOS_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${TEXOS_DB_POOL_MAX:6}
spring.datasource.hikari.minimum-idle=${TEXOS_DB_POOL_MIN_IDLE:6}
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=300000

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${TEXOS_JPA_DDL_AUTO:}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.texos.texos_backend.observability.DashboardSqlInspector
spring.jpa.properties.hibernate.session.events.auto=com.texos.texos_backend.observability.DashboardHibernateSessionListener
spring.flyway.baseline-on-migrate=true
# Existing JPA-created databases already contain the V1/V2 schema.
spring.flyway.baseline-version=2

# Expose only health and metrics; /actuator/** is restricted to the TexOS admin role.
management.endpoints.web.exposure.include=health,metrics

# Server Configuration
server.port=8080
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=5

# Customer Portal URL
app.customer-base-url=${TEXOS_CUSTOMER_BASE_URL}
app.frontend-origin=${TEXOS_FRONTEND_ORIGIN}
app.retention.enabled=${TEXOS_RETENTION_ENABLED:true}


# Customer session configuration
server.servlet.session.timeout=60d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${TEXOS_COOKIE_SECURE}
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=${TEXOS_COOKIE_SAME_SITE}

app.jwt.secret=${TEXOS_JWT_SECRET}
app.webpush.public-key=${TEXOS_VAPID_PUBLIC_KEY}
app.webpush.private-key=${TEXOS_VAPID_PRIVATE_KEY}
app.webpush.subject=${TEXOS_VAPID_SUBJECT}
app.google.client-id=${GOOGLE_CLIENT_ID}
app.phonepe.credential-encryption-key=${TEXOS_PHONEPE_CREDENTIAL_ENCRYPTION_KEY:}
app.phonepe.restaurant-merchants-enabled=${TEXOS_PHONEPE_RESTAURANT_MERCHANTS_ENABLED:false}
app.phonepe.partner-integration=${TEXOS_PHONEPE_PARTNER_INTEGRATION:false}
app.phonepe.subscriptions.client-id=${TEXOS_PHONEPE_SUBSCRIPTIONS_CLIENT_ID:}
app.phonepe.subscriptions.client-secret=${TEXOS_PHONEPE_SUBSCRIPTIONS_CLIENT_SECRET:}
app.phonepe.subscriptions.client-version=${TEXOS_PHONEPE_SUBSCRIPTIONS_CLIENT_VERSION:1}
app.phonepe.subscriptions.merchant-id=${TEXOS_PHONEPE_SUBSCRIPTIONS_MERCHANT_ID:}
app.phonepe.subscriptions.environment=${TEXOS_PHONEPE_SUBSCRIPTIONS_ENVIRONMENT:SANDBOX}
app.phonepe.subscriptions.webhook-key-id=${TEXOS_PHONEPE_SUBSCRIPTIONS_WEBHOOK_KEY_ID:}
app.phonepe.subscriptions.webhook-secret=${TEXOS_PHONEPE_SUBSCRIPTIONS_WEBHOOK_SECRET:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Brevo Email API
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.mail.sender-name=${MAIL_SENDER_NAME:}
app.mail.contact-to=${MAIL_CONTACT_TO:}

# Local placeholders only. Set TEXOS_ADMIN_USERNAME and TEXOS_ADMIN_PASSWORD
# in the deployment environment before exposing the admin portal.
app.admin.username=${TEXOS_ADMIN_USERNAME}
app.admin.password=${TEXOS_ADMIN_PASSWORD}

